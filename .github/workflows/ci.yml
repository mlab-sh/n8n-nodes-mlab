name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts skips native builds of transitive deps (e.g. isolated-vm,
      # pulled in by n8n-workflow). We only compile against types, never run n8n.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
